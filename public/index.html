<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lektüre-Check: Die Verwandlung</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#1f2328; --muted:#5f6670; --line:#dcd8cf; --accent:#2f5d50; --accent-ink:#fff;
  --ok:#1e7a46; --ok-bg:#e3f3e9; --warn:#9a6400; --warn-bg:#fbf0d9; --bad:#b42318; --bad-bg:#fbe7e5; --soft:#eef2f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{background:var(--accent);color:var(--accent-ink);padding:10px 16px;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.15)}
header.top .in{max-width:900px;margin:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;flex:1;min-width:180px;cursor:pointer}
header.top .info{font-size:14px;opacity:.95;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pill{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px;white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}
h2{font-size:21px;margin:0 0 10px} h3{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px} .muted{color:var(--muted)} .small{font-size:14px}
button,.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button.sec,.btn.sec{background:#fff;color:var(--accent)}
button.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
button.mini{padding:3px 9px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input[type=text],input[type=password],input[type=number],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
input.code{font-size:22px;letter-spacing:4px;text-transform:uppercase;width:10ch;text-align:center}
label.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px}
.big{font-size:44px;font-weight:700;line-height:1.1}
.err{color:var(--bad);font-weight:600}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 16px}
.q .meta{font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.q .frage{font-weight:600;margin-bottom:6px}
.q .hint{font-size:14px;color:var(--muted);margin-bottom:10px}
.tag{background:var(--soft);border-radius:6px;padding:1px 7px}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
td.c,th.c{text-align:center;width:72px}
.kp input,.mr input{width:20px;height:20px;cursor:pointer}
.mr label{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-top:1px solid var(--line);cursor:pointer}
.mr label input{margin-top:2px;flex:none}
.reihe li{display:flex;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#fbfaf7}
.reihe ol{padding:0;margin:0;list-style:none;counter-reset:r}
.reihe li::before{counter-increment:r;content:counter(r)".";font-weight:700;width:22px;flex:none}
.reihe li span{flex:1}
.reihe li button{padding:2px 9px}
.zu .zrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.zu .zrow span{flex:1;min-width:200px;font-style:italic}
.status{font-weight:700;border-radius:6px;padding:1px 8px;font-size:14px}
.st-richtig{background:var(--ok-bg);color:var(--ok)} .st-teilweise{background:var(--warn-bg);color:var(--warn)} .st-falsch{background:var(--bad-bg);color:var(--bad)}
.q.kor-richtig{border-left:5px solid var(--ok)} .q.kor-teilweise{border-left:5px solid var(--warn)} .q.kor-falsch{border-left:5px solid var(--bad)}
tr.wrong td{background:#fff7f6} .yes{color:var(--ok);font-weight:700} .no{color:var(--bad);font-weight:700}
.why{background:#f7f5ef;border-left:3px solid var(--accent);padding:8px 10px;margin:4px 0 8px;font-size:15px;border-radius:0 6px 6px 0}
.why b{color:var(--accent)}
details.beleg summary{cursor:pointer;font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px} .cols ol{margin:4px 0;padding-left:22px}
.cols li.bad{color:var(--bad)}
.stickybar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:18px 0 10px;display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.tbl td,.tbl th{font-size:15px} .tbl tr:hover td{background:#faf9f5}
.codebox{font-size:40px;font-weight:800;letter-spacing:6px;color:var(--accent)}
.np{display:inline-block;min-width:110px;text-align:center;padding:12px 16px;border-radius:12px;background:var(--soft)}
.np .big{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;overflow:auto;padding:24px 12px}
.modal .box{max-width:900px;margin:auto;background:var(--bg);border-radius:12px;padding:16px}
.keyrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.keyrow label{font-size:13px;color:var(--muted)} .keyrow input{width:70px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
@media (max-width:600px){ header.top h1{font-size:15px;min-width:0} header.top{padding:8px 12px} header.top .info{gap:8px;font-size:13px} main{padding:12px} .q{padding:14px 12px} .cols{grid-template-columns:1fr} td.c,th.c{width:54px} .big{font-size:36px} .codebox{font-size:30px} }
@media print{ header.top,.stickybar,.noprint{display:none!important} body{background:#fff} .q,.card{break-inside:avoid;border-color:#bbb} main{max-width:none} }
</style>
</head>
<body>
<header class="top"><div class="in"><h1 id="home">📖 Lektüre-Check: Kafka, „Die Verwandlung“</h1><div class="info" id="hinfo"></div></div></header>
<main id="app"></main>
<script>
'use strict';
// ---------- Helfer ----------
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const ROM = { 1: 'I', 2: 'II', 3: 'III' };
const TYPNAME = { kprim: 'Richtig/Falsch (Kprim)', mr: 'Mehrfachauswahl', reihe: 'Reihenfolge', zuordnung: 'Zuordnung' };
const HINWEIS = {
  kprim: 'Entscheide bei jeder Aussage: richtig oder falsch.',
  mr: 'Kreuze alle zutreffenden Antworten an. Es können eine oder mehrere richtig sein.',
  reihe: 'Bring die Ereignisse mit den Pfeilen in die richtige Reihenfolge.',
  zuordnung: 'Wähle zu jedem Zitat die passende Figur. Eine Figur kann mehrmals vorkommen.',
};
const de = (x) => String(x).replace('.', ',');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg) { const t = h('div', { class: 'toast' }, msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }
async function api(path, opt = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (opt.lehrer) headers['X-Lehrer-Token'] = store.get('vw_lehrer', '');
  const r = await fetch(path, { method: opt.method || (opt.body ? 'POST' : 'GET'), headers, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let data = {}; try { data = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(data.fehler || 'Verbindungsfehler'); e.status = r.status; throw e; }
  return data;
}
const app = $('#app');
function view(...nodes) { stopTimers(); app.replaceChildren(...nodes.flat().filter((n) => n != null && n !== '' && n !== false)); window.scrollTo(0, 0); }
function setInfo(...nodes) { $('#hinfo').replaceChildren(...nodes.flat()); }
let timers = [];
function stopTimers() { timers.forEach(clearInterval); timers = []; }
$('#home').onclick = () => { if (quiz && quiz.modus === 'pruefung' && !quiz.fertig) return; location.hash = ''; route(); };

// ---------- Startseite ----------
async function startseite() {
  setInfo();
  let meta = { uebenAktiv: true };
  try { meta = await api('/api/meta'); } catch {}
  const aktiv = store.get('vw_aktiv', null);
  const code = new URLSearchParams(location.search).get('code') || '';
  const msg = h('p', { class: 'err' });
  const inp = h('input', { type: 'text', class: 'code', maxlength: 10, value: code, placeholder: 'CODE', 'aria-label': 'Prüfungscode' });
  const join = async () => {
    msg.textContent = '';
    const c = inp.value.trim().toUpperCase(); if (!c) return;
    const alt = store.get('vw_teilnahmen', {})[c];
    if (alt) { try { const s = await api('/api/pruefung/status', { body: { token: alt } }); return pruefungStarten(alt, s); } catch {} }
    try { const s = await api('/api/pruefung/beitreten', { body: { code: c } }); const tn = store.get('vw_teilnahmen', {}); tn[c] = s.token; store.set('vw_teilnahmen', tn); pruefungStarten(s.token, s); }
    catch (e) { msg.textContent = e.message; }
  };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
  const uebenKarte = meta.uebenAktiv ? h('div', { class: 'card' },
    h('h2', null, '🔀 Üben'),
    h('p', null, 'Jedes Mischen stellt eine neue Auswahl zusammen: etwa 60 % Textkenntnis (AFB I), 30 % Zusammenhänge (AFB II), 10 % Deutung (AFB III). Nach dem Auswerten siehst du zu jedem Fehler eine Erklärung mit Textstelle.'),
    h('div', { class: 'row' },
      h('button', { onclick: () => uebenStarten(0) }, 'Durchmischen: ganzes Werk (24 Fragen)')),
    h('p', { class: 'small muted', style: 'margin-top:10px' }, 'Nur ein Kapitel üben (10 Fragen):'),
    h('div', { class: 'row' }, [1, 2, 3].map((k) => h('button', { class: 'sec', onclick: () => uebenStarten(k) }, 'Kapitel ' + ROM[k]))))
    : h('div', { class: 'card' }, h('h2', null, '🔀 Üben'), h('p', { class: 'muted' }, 'Der Übungsmodus ist gerade gesperrt, zum Beispiel weil eine Prüfung läuft.'));
  view(
    aktiv ? h('div', { class: 'card', style: 'border-color:var(--accent)' }, h('h3', null, 'Laufende Prüfung'), h('p', null, 'Auf diesem Gerät ist eine Prüfung noch nicht abgegeben.'), h('button', { onclick: async () => { try { const s = await api('/api/pruefung/status', { body: { token: aktiv } }); pruefungStarten(aktiv, s); } catch (e) { store.del('vw_aktiv'); toast(e.message); startseite(); } } }, 'Prüfung fortsetzen')) : '',
    h('div', { class: 'grid3' },
      uebenKarte,
      h('div', { class: 'card' },
        h('h2', null, '📝 Prüfung'),
        h('p', null, 'Gib den Code ein, den deine Lehrkraft dir nennt. Du bekommst eine Prüfungsnummer zugeteilt, dein Name wird nicht abgefragt.'),
        h('div', { class: 'row' }, inp, h('button', { onclick: join }, 'Beitreten')), msg)),
    h('p', { class: 'small muted', style: 'text-align:center' }, h('a', { href: '#lehrkraft' }, 'Bereich für Lehrkräfte')),
  );
  if (code) inp.focus();
}

// ---------- Quiz (Üben & Prüfung) ----------
let quiz = null; // {modus, fragen, antworten, salt, set, token, ...}
async function uebenStarten(kap) {
  try {
    const d = await api('/api/ueben/neu', { body: { kapitel: kap } });
    quiz = { modus: 'ueben', kap, fragen: d.fragen, set: d.set, salt: d.salt, antworten: {} };
    quizAnzeigen();
  } catch (e) { toast(e.message); }
}
function pruefungStarten(token, s) {
  if (s.abgegeben) { store.del('vw_aktiv'); quiz = { modus: 'pruefung', token, nr: s.nr, titel: s.titel, fertig: true }; return ergebnisPruefung(s); }
  store.set('vw_aktiv', token);
  const lokal = store.get('vw_antw_' + token, {});
  quiz = { modus: 'pruefung', token, nr: s.nr, titel: s.titel, fragen: s.fragen, antworten: Object.assign({}, s.antworten, lokal), deadline: s.deadline, offset: s.jetzt - Date.now() };
  quizAnzeigen();
}
function bearbeitet(q, a) {
  if (!a) return false;
  if (q.typ === 'kprim') return q.items.every((it) => typeof a[it.k] === 'boolean');
  if (q.typ === 'mr') return !!a.beruehrt;
  if (q.typ === 'reihe') return Array.isArray(a.folge);
  return q.items.every((it) => typeof a[it.k] === 'string' && a[it.k]);
}
let saveT = null;
function geaendert() {
  const n = quiz.fragen.filter((q) => bearbeitet(q, quiz.antworten[q.id])).length;
  const z = $('#zaehler'); if (z) z.textContent = `${n} von ${quiz.fragen.length} bearbeitet`;
  if (quiz.modus === 'pruefung') {
    store.set('vw_antw_' + quiz.token, quiz.antworten);
    clearTimeout(saveT); const s = $('#speicher'); if (s) s.textContent = 'speichert …';
    saveT = setTimeout(async () => {
      try { await api('/api/pruefung/speichern', { body: { token: quiz.token, antworten: quiz.antworten } }); if ($('#speicher')) $('#speicher').textContent = '✓ gespeichert'; }
      catch (e) { if ($('#speicher')) $('#speicher').textContent = '⚠ ' + e.message; }
    }, 1200);
  }
}
function frageKarte(q, i) {
  const a = quiz.antworten[q.id] || (quiz.antworten[q.id] = q.typ === 'mr' ? { wahl: [] } : {});
  const body = h('div');
  if (q.typ === 'kprim') {
    body.append(h('table', { class: 'kp' }, h('tr', null, h('th', null, 'Aussage'), h('th', { class: 'c' }, 'richtig'), h('th', { class: 'c' }, 'falsch')),
      q.items.map((it) => h('tr', null, h('td', null, it.t),
        [true, false].map((v) => h('td', { class: 'c' }, h('input', { type: 'radio', name: q.id + it.k, 'aria-label': v ? 'richtig' : 'falsch', checked: a[it.k] === v, onchange: () => { a[it.k] = v; geaendert(); } })))))));
  } else if (q.typ === 'mr') {
    body.append(h('div', { class: 'mr' }, q.items.map((it) => h('label', null, h('input', { type: 'checkbox', checked: a.wahl.includes(it.k), onchange: (e) => { a.beruehrt = true; a.wahl = a.wahl.filter((k) => k !== it.k); if (e.target.checked) a.wahl.push(it.k); geaendert(); } }), h('span', null, it.t)))));
  } else if (q.typ === 'reihe') {
    if (!Array.isArray(a.folge)) a._start = q.items.map((it) => it.k);
    const ol = h('ol');
    const draw = () => {
      const folge = a.folge || a._start;
      ol.replaceChildren(...folge.map((k, pos) => {
        const it = q.items.find((x) => x.k === k);
        const mv = (d) => { const f = folge.slice(); [f[pos], f[pos + d]] = [f[pos + d], f[pos]]; a.folge = f; draw(); geaendert(); };
        return h('li', null, h('span', null, it.t), h('button', { class: 'sec', disabled: pos === 0, 'aria-label': 'nach oben', onclick: () => mv(-1) }, '▲'), h('button', { class: 'sec', disabled: pos === folge.length - 1, 'aria-label': 'nach unten', onclick: () => mv(1) }, '▼'));
      }));
    };
    draw();
    body.append(h('div', { class: 'reihe' }, ol, h('p', { class: 'small muted', style: 'margin:6px 0 0' }, 'Die Aufgabe zählt als bearbeitet, sobald du mindestens einmal etwas verschoben hast.')));
  } else {
    body.append(h('div', { class: 'zu' }, q.items.map((it) => h('div', { class: 'zrow' }, h('span', null, it.t),
      h('select', { onchange: (e) => { a[it.k] = e.target.value; geaendert(); } }, h('option', { value: '' }, '– bitte wählen –'), q.kategorien.map((c) => h('option', { value: c, selected: a[it.k] === c }, c)))))));
  }
  return h('div', { class: 'q', id: 'q-' + q.id },
    h('div', { class: 'meta' }, h('b', null, `Aufgabe ${i + 1}`), h('span', { class: 'tag' }, 'Kapitel ' + ROM[q.kap])),
    h('div', { class: 'frage' }, q.frage), h('div', { class: 'hint' }, HINWEIS[q.typ]), body);
}
function quizAnzeigen() {
  const ist = quiz.modus === 'pruefung';
  const info = [h('span', { class: 'pill', id: 'zaehler' }, '')];
  if (ist) { info.unshift(h('span', { class: 'pill' }, 'Prüfungsnummer ' + quiz.nr)); info.push(h('span', { id: 'speicher', class: 'small' }, '')); }
  if (ist && quiz.deadline) info.push(h('span', { class: 'pill', id: 'uhr' }, ''));
  setInfo(...info);
  const abgabe = h('button', { onclick: abschicken }, ist ? 'Prüfung abgeben' : 'Auswerten');
  view(
    h('div', { class: 'card' },
      ist ? h('div', null, h('h2', null, quiz.titel), h('p', null, 'Deine Prüfungsnummer ist ', h('b', { style: 'font-size:20px' }, quiz.nr), '. Notiere sie dir. Deine Antworten werden automatisch gespeichert. Nach der Abgabe kannst du nichts mehr ändern.'))
        : h('div', null, h('h2', null, quiz.kap ? `Übung: Kapitel ${ROM[quiz.kap]}` : 'Übung: ganzes Werk'), h('p', { class: 'muted' }, 'Beantworte alle Aufgaben und klicke dann auf „Auswerten“. Teilpunkte gibt es, wenn nur eine Entscheidung falsch ist.'))),
    quiz.fragen.map(frageKarte),
    h('div', { class: 'stickybar' }, !ist ? h('button', { class: 'sec', onclick: () => { if (confirm('Neue Fragen mischen? Deine Antworten gehen verloren.')) uebenStarten(quiz.kap); } }, 'Neu durchmischen') : '', abgabe),
  );
  geaendert(); if ($('#speicher')) $('#speicher').textContent = '';
  if (ist && quiz.deadline) {
    const tick = () => {
      const rest = quiz.deadline - (Date.now() + quiz.offset);
      const u = $('#uhr'); if (!u) return;
      if (rest <= 0) { u.textContent = 'Zeit abgelaufen'; stopTimers(); abschicken(true); return; }
      const m = Math.floor(rest / 60000), s = Math.floor((rest % 60000) / 1000);
      u.textContent = `⏱ ${m}:${String(s).padStart(2, '0')}`;
      u.style.background = rest < 120000 ? '#b42318' : '';
    };
    tick(); timers.push(setInterval(tick, 1000));
  }
}
async function abschicken(auto) {
  const offen = quiz.fragen.filter((q) => !bearbeitet(q, quiz.antworten[q.id])).length;
  if (auto !== true) {
    const t = quiz.modus === 'pruefung' ? 'Prüfung jetzt endgültig abgeben?' : 'Jetzt auswerten?';
    if (!confirm(offen ? `${t}\n\nNoch nicht bearbeitet: ${offen} Aufgabe(n).` : t)) return;
  }
  const antworten = {};
  for (const [k, v] of Object.entries(quiz.antworten)) { const c = Object.assign({}, v); delete c._start; antworten[k] = c; }
  try {
    if (quiz.modus === 'ueben') {
      const r = await api('/api/ueben/auswerten', { body: { set: quiz.set, salt: quiz.salt, antworten } });
      ergebnisAnzeigen(r, { ueben: true });
    } else {
      clearTimeout(saveT);
      const s = await api('/api/pruefung/abgeben', { body: { token: quiz.token, antworten } });
      store.del('vw_aktiv'); store.del('vw_antw_' + quiz.token); quiz.fertig = true;
      ergebnisPruefung(s);
    }
  } catch (e) { toast(e.message); }
}
function npBox(r) {
  return h('div', { class: 'row', style: 'gap:18px' },
    h('div', { class: 'np' }, h('div', { class: 'big' }, r.np), h('div', { class: 'small muted' }, 'Notenpunkte')),
    h('div', null, h('p', { style: 'margin:0' }, h('b', null, `${de(r.punkte)} von ${r.max} Punkten`), ` (${de(r.prozent)} %)`), h('p', { class: 'small muted', style: 'margin:0' }, 'Pro Aufgabe 1 Punkt, ½ Punkt bei genau einer falschen Entscheidung.')));
}
function ergebnisPruefung(s) {
  setInfo(h('span', { class: 'pill' }, 'Prüfungsnummer ' + s.nr));
  const box = h('div');
  const zeigeKorrektur = async () => {
    try { const r = await api('/api/pruefung/korrektur', { body: { token: quiz.token } }); box.replaceChildren(korrekturListe(r.details)); }
    catch (e) { box.replaceChildren(h('p', { class: 'err' }, e.message), h('button', { class: 'sec', onclick: zeigeKorrektur }, 'Erneut versuchen')); }
  };

async function poolAnzeigen() {
  let pool; try { pool = await lapi('/api/lehrer/pool'); } catch { return; }
  setInfo(h('a', { href: '#lehrkraft', class: 'pill', style: 'color:#fff' }, '← Übersicht'));
  const fk = h('select', null, h('option', { value: '' }, 'alle Kapitel'), [1, 2, 3].map((k) => h('option', { value: k }, 'Kapitel ' + ROM[k])));
  const fa = h('select', null, h('option', { value: '' }, 'alle AFB'), [1, 2, 3].map((k) => h('option', { value: k }, 'AFB ' + ROM[k])));
  const liste = h('div');
  const draw = () => {
    const sel = pool.filter((q) => (!fk.value || q.kap == fk.value) && (!fa.value || q.afb == fa.value));
    liste.replaceChildren(...sel.map((q) => korrekturKarte(q.typ === 'reihe' ? { ...q, loesung: q.items } : { ...q, items: q.items.map((it) => ({ ...it, loesung: it.ok })) }, 0, { pool: true })));
  };
  fk.onchange = fa.onchange = draw;

// ---------- Routing ----------
async function route() {
  document.querySelectorAll('.modal').forEach((m) => m.remove());
  const hsh = location.hash.replace(/^#/, '');
  if (hsh.startsWith('lehrkraft') || hsh === 'pool') {
    if (!store.get('vw_lehrer', '')) return lehrerLogin();
    if (hsh === 'pool') return poolAnzeigen();
    const code = hsh.split('/')[1];
    return code ? lehrerPruefung(code) : lehrerDashboard();
  }
  const aktiv = store.get('vw_aktiv', null);
  if (aktiv && !quiz) { try { const s = await api('/api/pruefung/status', { body: { token: aktiv } }); return pruefungStarten(aktiv, s); } catch { store.del('vw_aktiv'); } }
  startseite();
}
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', (e) => { if (quiz && !quiz.fertig && quiz.modus === 'pruefung') { e.preventDefault(); e.returnValue = ''; } });
route();
